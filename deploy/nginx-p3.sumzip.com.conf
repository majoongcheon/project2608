# Pioneer 3 Team - p3.sumzip.com
# 돌봄부담 경량 진단 및 지도 기반 복지서비스 안내
#
# 설치 위치: /opt/homebrew/etc/nginx/servers/p03.conf
# 이 서버는 vhost 82개를 함께 돌리는 공유 nginx다. **이 파일 밖은 건드리지 않는다.**
#
# 2026-09-01 변경 — 502 원인 수정
#
#   이전:  location / { proxy_pass https://192.168.0.19:9503; }
#   이후:  location /api/ { proxy_pass http://192.168.0.19:9523; }   백엔드
#          location /     { proxy_pass http://192.168.0.19:9503; }   프론트엔드
#
#   포트 9503 자체는 맞았다(팀 배정 프론트 포트). 틀린 것은 두 가지였다.
#     1) 스킴이 https 였다 — 프론트엔드는 평문 HTTP 로 뜬다. 이것이 502 의 직접 원인이다.
#     2) /api/ 분리가 없어 API 요청이 프론트엔드로 갔다.
#
# 인증서는 기존 경로를 그대로 쓴다 — TLS 핸드셰이크가 이미 성공하고 있어 p3.sumzip.com 을 포함한다.

upstream p3_frontend {
    server 192.168.0.19:9503;
    keepalive 16;
}

upstream p3_backend {
    server 192.168.0.19:9523;
    keepalive 16;
}

# ── HTTPS ────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name p3.sumzip.com;

    ssl_certificate     /etc/letsencrypt/live/jupyter.sumzip.com-0005/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jupyter.sumzip.com-0005/privkey.pem;

    # FR-028 · 원칙 III — 원본 IP 를 어떤 저장소에도 남기지 않는다.
    #   전역 log_format 'main' 이 $remote_addr 를 남기므로 이 vhost 에서만 끈다.
    #   (log_format 은 http 컨텍스트에서만 정의할 수 있어 nginx.conf 를 고쳐야 하는데,
    #    공유 서버라 다른 82개 vhost 에 영향을 주지 않도록 access_log off 로 대신한다.)
    access_log off;

    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── API → 백엔드 9523 ─────────────────────────────────────────
    #   location 우선순위상 /api/ 가 / 보다 먼저 매칭된다.
    location /api/ {
        proxy_pass http://p3_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Connection        "";
        # 백엔드는 이 값을 제출자 구분 해시(FR-036) 생성에만 쓰고 저장·로깅하지 않는다.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── 그 외 → 프론트엔드 9503 ───────────────────────────────────
    #   vite preview 가 빌드본(frontend/dist)을 서빙하며 SPA 히스토리 폴백을 처리한다.
    location / {
        proxy_pass http://p3_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        'upgrade';
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

# ── HTTP ─────────────────────────────────────────────────────────────
#   기존 설정과 같이 80 에서도 그대로 서비스한다(리다이렉트로 바꾸지 않았다 —
#   같은 nginx 의 다른 vhost 들과 동작을 맞추고 변경 범위를 좁히기 위함).
server {
    listen 80;
    server_name p3.sumzip.com;

    access_log off;
    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://p3_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Connection        "";
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://p3_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        'upgrade';
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
